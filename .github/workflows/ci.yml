name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Unit tests
        run: go test ./physics/... ./ext/... ./mesh/...

      - name: Parity tests
        run: go test ./tests/parity/...

      - name: Ebitengine boundary check
        run: ./scripts/check_no_ebitengine_in_physics.sh

      - name: cgo boundary check
        run: ./scripts/check_no_cgo_in_core.sh
